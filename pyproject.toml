[project]
name = "schain"
version = "0.1.0"
description = "Supply Chain Knowledge Graph V1 (INGEST / EXPAND)"
requires-python = ">=3.10,<3.15"

# Confirmed against installed releases, not from memory:
#   neo4j-graphrag 1.19.0 provides the KG Builder components we reuse (text splitting,
#   schema-guided extraction) and pulls the official neo4j driver (>=5.28.4).
#   Its [openai] extra provides OpenAILLM, which accepts base_url and therefore also
#   serves a local vLLM OpenAI-compatible endpoint.
dependencies = [
    "neo4j-graphrag[openai]>=1.19.0,<2.0.0",
    "pandas>=2.2",
    "pyarrow>=20.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",          # async retrieval with bounded concurrency
    "trafilatura>=1.12",    # article text extraction from fetched news HTML
    # trafilatura -> justext needs lxml.html.clean, which moved out of lxml in 5.2 into
    # its own package. Without this, importing trafilatura fails on a clean install and
    # full-text extraction silently degrades to title+snippet everywhere.
    "lxml-html-clean>=0.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Visualization renders self-contained HTML with vis-network (CDN) and needs no
# extra Python packages beyond the core dependencies. The extra exists so notebooks
# and docs can say: pip install -e ".[viz]"
viz = []

[project.scripts]
schain = "schain.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["schain*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "integration: needs Neo4j, a model endpoint or network access; skips when absent",
]
