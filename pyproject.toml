[project]
name = "schain"
version = "0.1.0"
description = "Supply Chain Knowledge Graph V1 (INGEST / EXPAND)"
requires-python = ">=3.10,<3.15"

# Confirmed against the installed releases, not from memory:
#   neo4j-graphrag 1.19.0 provides the KG Builder components we reuse
#   (text splitting, schema-guided extraction, Neo4j writing, entity resolution)
#   and pulls the official neo4j driver (>=5.28.4) transitively.
#   The [openai] extra provides OpenAILLM, which accepts base_url and is
#   therefore also the client for a local vLLM OpenAI-compatible server.
dependencies = [
    "neo4j-graphrag[openai]>=1.19.0,<2.0.0",
    "pandas>=2.2",
    "pyarrow>=20.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# The project is run from the repository root (src/main.py); nothing is packaged
# for distribution, so package auto-discovery is disabled on purpose.
[tool.setuptools]
packages = []
