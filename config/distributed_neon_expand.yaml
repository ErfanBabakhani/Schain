# Distributed EXPAND: several workers share one PostgreSQL (Neon) experiment.
#
#   python -m schain expand --config config/distributed_neon_expand.yaml
#
# Needs NEON_DATABASE_URL in .env. See docs/DISTRIBUTED_NEON_EXPAND.md.

include:
  - config/expansion.yaml

state:
  backend: postgres
  experiment_id: bmw-supply-chain-v1

distributed:
  enabled: true

save:
  enabled: true
