# Colab runtime overlay for a single-runtime EXPAND with Neo4j saving.
#
#   python -m schain expand --config config/colab_professor_expand.yaml --save
#
# A runtime overlay may change how the run executes, never what it studies: seeds and
# max_tier stay authoritative in expansion.yaml (the loader rejects them here). Use
# --seed/--max-tier/--max-documents for an explicit experiment change.

include:
  - config/expansion.yaml
runtime_overlay: true

# One request at a time on a single Colab GPU.
concurrency:
  llm_max_concurrency: 1

ingest:
  # Keep the full source; extract at most four origin-ranked original chunks.
  # Checkpoints/metrics record omitted chunks and partial coverage explicitly.
  max_chunks_per_document: 4

save:
  enabled: true
  retry_backoff_seconds: 2.0

# The notebook supplies experiment_id, a Google Drive directory and local storage
# paths through an untracked runtime overlay, which enables checkpoint_store.
