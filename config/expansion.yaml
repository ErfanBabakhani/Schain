# EXPAND: discover upstream suppliers from seed companies.
#
#   .venv/bin/python -m schain expand --config config/expansion.yaml

include:
  - config/base.yaml

mode: expand

# Tier 0. For testing automatic expansion these are OEM seeds only, so that suppliers
# are actually discovered rather than supplied up front. The full AlMahri selected-company
# set (add the two groups below to seeds) is the strict replication configuration.
seeds:
  ev_manufacturers:
    - Toyota
    - Tesla Inc.
    - BMW
    - BYD Co., Ltd.
  # battery_suppliers:
  #   - Samsung SDI
  #   - CATL
  #   - Panasonic
  # mining_companies:
  #   - Zijin Mining
  #   - Albemarle Corporation
  #   - Tianqi Lithium
  #   - Ganfeng Lithium Co Ltd
  #   - Norilsk Nickel
  #   - Jinchuan Group

expansion:
  # Tier is graph distance along supplier --suppliesTo--> customer, never industrial
  # role: a mining company selling directly to an OEM is Tier 1, not a "deep" tier.
  # Tier 0 = seeds, Tiers 1-6 = successive upstream suppliers. Tier 6 is terminal:
  # its entities and relations are stored, but it is never searched.
  max_tier: 6
  # Safety stop for a run; 0 means no limit.
  max_documents: 0

  sources:
    # News: explicit new supply agreements.
    google_news:
      enabled: true
      language: en-US
      # Google News RSS links are redirect wrappers, so a body often cannot be fetched;
      # such documents fall back to title + snippet.
      fetch_full_text: true
    gdelt:
      enabled: true
      fetch_full_text: true
    # General web: company supplier/sourcing pages, press releases, investor relations,
    # annual and sustainability reports, filings. Older and more stable than news.
    general_web:
      enabled: true
      # duckduckgo needs no credentials. Set backend: brave and BRAVE_SEARCH_API_KEY in
      # .env for the official API, which is more reliable for a long run.
      backend: duckduckgo
      fetch_full_text: true
    # Reference material. Wikipedia is an ordinary search provider here: queries go to
    # its search endpoint and matching articles come back. It has no special graph role,
    # and the pipeline never assumes "fetch this entity's own page".
    wikipedia:
      enabled: true
      language: en

  # Cheap filter applied before any LLM call.
  relevance:
    require_entity_mention: true
    min_chars: 200
    # Add the EV vocabulary below to these keywords.
    include_vocabulary: true
    keywords:
      - supplier
      - suppliers
      - supply
      - supplies
      - sourcing
      - sources
      - procurement
      - contract
      - agreement
      - deliver
      - raw material
      - offtake

  # Optional EV vocabulary, used only to widen the relevance filter above. It is NOT
  # multiplied with entity names to generate queries: the fixed tier templates remain
  # the only query mechanism.
  vocabulary:
    components:
      [battery, battery cell, battery pack, cathode, anode, electrolyte, separator,
       semiconductor, chip, inverter, motor, e-axle, wiring harness]
    materials:
      [lithium, nickel, cobalt, manganese, graphite, copper, aluminum, steel, rare earth]
    upstream:
      [CAM, cathode active material, pCAM, precursor cathode active material, sulfate,
       hydroxide, carbonate, concentrate, MHP, matte, refinery, refining, smelter, mine,
       mining, extraction, ore, brine, spodumene, laterite]

  # Query limits use "closest value wins", resolved per field:
  #     global defaults  <  tier defaults  <  per-query override
  #
  # max_results is a limit PER PROVIDER, PER QUERY, and is a ceiling on candidates
  # retrieved - not a target number of relevant documents.
  # max_results_by_provider overrides max_results for the providers it names.
  search:
    defaults:
      max_results: 30
      providers: [google_news, gdelt, general_web, wikipedia]
      max_results_by_provider:
        general_web: 30
        wikipedia: 10

    tiers:
      0:
        defaults:
          max_results: 50               # news providers
          max_results_by_provider: {general_web: 30, wikipedia: 10}
        queries:
          - query: '"{entity}" suppliers'
          - query: '"{entity}" sourcing'
          - query: '"{entity}" "supply agreement"'
          - query: '"{entity}" battery suppliers'
          - query: '"{entity}" semiconductor suppliers'
          - query: '"{entity}" raw material supply'

      1:
        defaults:
          max_results: 50
          max_results_by_provider: {general_web: 30, wikipedia: 10}
        queries:
          - query: '"{entity}" suppliers'
          - query: '"{entity}" sourcing'
          - query: '"{entity}" "supply agreement"'
          - query: '"{entity}" component suppliers'
          - query: '"{entity}" battery material suppliers'
          - query: '"{entity}" raw material suppliers'

      2:
        defaults:
          max_results: 50
          max_results_by_provider: {general_web: 30, wikipedia: 10}
        queries:
          - query: '"{entity}" suppliers'
          - query: '"{entity}" sourcing'
          - query: '"{entity}" "supply agreement"'
          - query: '"{entity}" material suppliers'
          - query: '"{entity}" precursor suppliers'
          - query: '"{entity}" feedstock suppliers'

      3:
        defaults:
          max_results: 40
          max_results_by_provider: {general_web: 25, wikipedia: 10}
        queries:
          - query: '"{entity}" suppliers'
          - query: '"{entity}" raw material suppliers'
          - query: '"{entity}" feedstock'
          - query: '"{entity}" precursor'
          - query: '"{entity}" refining'
          - query: '"{entity}" "offtake agreement"'

      4:
        defaults:
          max_results: 30
          max_results_by_provider: {general_web: 20, wikipedia: 10}
        queries:
          - query: '"{entity}" suppliers'
          - query: '"{entity}" feedstock suppliers'
          - query: '"{entity}" refinery suppliers'
          - query: '"{entity}" concentrate suppliers'
          - query: '"{entity}" ore suppliers'
          - query: '"{entity}" "offtake agreement"'

      5:
        defaults:
          max_results: 30
          max_results_by_provider: {general_web: 20, wikipedia: 10}
        queries:
          - query: '"{entity}" suppliers'
          - query: '"{entity}" raw material sourcing'
          - query: '"{entity}" mining suppliers'
          - query: '"{entity}" mines'
          - query: '"{entity}" extraction'
          - query: '"{entity}" "offtake agreement"'

      6:
        # Terminal tier: Tier-6 entities and their relations are stored, but no search
        # is performed for them and nothing is promoted to Tier 7.
        expand: false
