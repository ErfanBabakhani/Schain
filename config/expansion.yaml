# EXPAND mode: discover upstream suppliers, tier by tier, starting from seed companies.
#
#   python -m schain expand
#
# deep_discovery.yaml, smoke.yaml and the distributed/Colab configs build on this file.

include:
  - config/base.yaml

mode: expand

# Tier 0. These are OEM seeds only, so that suppliers are actually discovered rather
# than supplied up front. For strict replication of the AlMahri selected-company set,
# uncomment the two groups below as well.
seeds:
  ev_manufacturers:
    - Toyota
    - Tesla Inc.
    - BMW
    - BYD Co., Ltd.
  # battery_suppliers:
  #   - Samsung SDI
  #   - CATL
  #   - Panasonic
  # mining_companies:
  #   - Zijin Mining
  #   - Albemarle Corporation
  #   - Tianqi Lithium
  #   - Ganfeng Lithium Co Ltd
  #   - Norilsk Nickel
  #   - Jinchuan Group

expansion:
  # Tier = graph distance along supplier --suppliesTo--> customer, never industrial
  # role: a mining company selling directly to an OEM is Tier 1. Only suppliesTo
  # advances tiers. Tiers below max_tier are searched; max_tier itself is stored only.
  max_tier: 5

  # Documents selected per run (the --max-documents flag). Reaching it pauses the run;
  # it never prunes the frontier, and the next run resumes where this one stopped.
  max_documents: 320

  # Soft per-run scheduling batch per tier: ORDER fairness only. Every accepted
  # supplier is enqueued and eventually processed; nobody is excluded by a cutoff.
  scheduling_batch_size_by_tier: {1: 10, 2: 8, 3: 6, 4: 4}

  # Per frontier entity. A target is a checkpoint, not a stop; a maximum is the useful
  # spend ceiling including zero-yield escalation.
  retrieval:
    target_documents_by_tier: {0: 24, 1: 14, 2: 10, 3: 8, 4: 6, 5: 0}
    max_documents_by_tier: {0: 36, 1: 24, 2: 18, 3: 14, 4: 10, 5: 0}
    # Fallback target for a tier missing above, and a cap over every tier. Keep the cap
    # >= the largest tier maximum, or it silently lowers those maxima.
    target_documents_per_entity: 24
    max_documents_per_entity: 36
    zero_gain_patience: 3
    min_documents_before_diminishing_returns: 3
    # Resolve/fetch a bounded ranked pool; selected snippets remain valid evidence.
    max_full_text_fetches_per_entity: 48
    # Title+publisher recovery attempts per entity after a Google News wrapper failure.
    max_title_lookups_per_entity: 12
    max_candidates_per_entity: 96
    # When the primary pass yields no expansion edge, escalate through search stages.
    zero_yield_rescue: true
    # LLM-assisted steps: semantic adjudication of genuinely ambiguous candidates, a
    # second evidence pass, and planned upstream queries during escalation.
    semantic_direction_adjudication: true
    evidence_second_pass: true
    query_planner_enabled: true
    query_planner_max_categories: 8
    query_planner_max_queries: 12

  sources:
    # News: new supply agreements.
    google_news:
      enabled: true
      language: en-US
      # Resolve publisher links before full-text fetch; snippets remain the fallback.
      fetch_full_text: true
    gdelt:
      enabled: true
      fetch_full_text: true
    # General web: supplier/sourcing pages, press releases, investor relations, annual
    # and sustainability reports, filings. Older and more stable than news.
    general_web:
      enabled: true
      # duckduckgo needs no credentials. `backend: brave` plus BRAVE_SEARCH_API_KEY in
      # .env uses the official API, which is more reliable over a long run.
      backend: duckduckgo
      fetch_full_text: true
    # An ordinary search provider: queries go to Wikipedia search and matching articles
    # come back. The pipeline never assumes "fetch this entity's own page".
    wikipedia:
      enabled: true
      language: en

  # Cheap filter applied before any LLM call.
  relevance:
    require_entity_mention: true
    min_chars: 200
    # Explicit title/snippet supplier headlines may be shorter than min_chars.
    title_snippet_min_chars: 40
    # Add the EV vocabulary below to these keywords.
    include_vocabulary: true
    keywords:
      - supplier
      - suppliers
      - supply
      - supplies
      - sourcing
      - sources
      - procurement
      - contract
      - agreement
      - deliver
      - raw material
      - offtake

  # Widens the relevance filter only. It is never combined with entity names to make
  # queries: the tier templates below are the only query mechanism.
  vocabulary:
    components:
      [battery, battery cell, battery pack, cathode, anode, electrolyte, separator,
       semiconductor, chip, inverter, motor, e-axle, wiring harness]
    materials:
      [lithium, nickel, cobalt, manganese, graphite, copper, aluminum, steel, rare earth]
    upstream:
      [CAM, cathode active material, pCAM, precursor cathode active material, sulfate,
       hydroxide, carbonate, concentrate, MHP, matte, refinery, refining, smelter, mine,
       mining, extraction, ore, brine, spodumene, laterite]

  # Query limits resolve field by field, closest value wins:
  #     search.defaults  <  tier defaults  <  per-query override
  # max_results is a candidate ceiling PER PROVIDER, PER QUERY - not a document target.
  search:
    defaults:
      max_results: 14
      providers: [google_news, gdelt, general_web, wikipedia]
      max_results_by_provider:
        google_news: 10
        gdelt: 16
        general_web: 18
        wikipedia: 4

    # Stage A (directional) and Stage B (broad) templates, shared by Tiers 0-4.
    # Stages C-E are generated at runtime by the escalation ladder when rescue runs.
    tiers:
      0: &tier_queries
        queries:
          - query: 'supplies "{entity}"'
          - query: '"supplier to" "{entity}"'
          - query: '"{entity}" sources from supplier'
          - query: '"{entity}" purchases from supplier'
          - query: '"{entity}" procurement supplier'
          - query: '"{entity}" suppliers'
          - query: '"{entity}" key suppliers'
          - query: '"{entity}" major suppliers'
          - query: '"{entity}" component suppliers'
          - query: '"{entity}" supply chain'
          - query: '"{entity}" supplier list'
          - query: '"{entity}" key suppliers list'
          - query: '"{entity}" supplier award'
          - query: '"{entity}" procurement report'
          - query: '"{entity}" sourcing report'
          - query: '"{entity}" sustainability report suppliers'
          - query: '"{entity}" annual report suppliers'
          - query: '"{entity}" supply chain report'
          - query: '"{entity}" filetype:pdf suppliers'
      1: *tier_queries
      2: *tier_queries
      3: *tier_queries
      4: *tier_queries
      5:
        expand: false
