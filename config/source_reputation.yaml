# -------------------------------------------------------------------
# Optional dynamic rules.
# These are evaluated after exact/suffix domain registry matching.
# They should not rely on arbitrary text; use metadata available in SChain.
# -------------------------------------------------------------------
dynamic_rules:

  # If SChain later stores official domains on canonical Company entities,
  # a match to the subject/object official domain receives primary-source status.
  official_entity_domain_match:
    enabled: true
    score: 95
    class: official_primary

  # If a domain is absent from the registry:
  fallback_unknown:
    enabled: true
    score: 50
    class: unknown

# -------------------------------------------------------------------
# Recommended output metadata per evidence/document.
# -------------------------------------------------------------------
output_fields:
  - retrieval_url
  - canonical_source_url
  - source_domain
  - source_known
  - source_class
  - source_base_score
  - source_effective_score
  - content_source
  - source_group_id
  - evidence_entailment
  - ontology_valid

# Recommended aggregated edge fields:
edge_output_fields:
  - fact_count
  - document_count
  - independent_support_count
  - max_source_score
  - average_source_score
  - full_text_support_count
  - trusted_source_count
  - verification_status
  - frontier_eligible
