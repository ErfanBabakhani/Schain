# SChain Source Reputation Policy
# ------------------------------------------------------------
# Purpose:
#   Provide a configurable PRIOR for source quality as DISPLAY / ANALYSIS
#   metadata on documents, facts, and graph export.
#
# Important (current pipeline):
#   - Source reputation is INFORMATIONAL only.
#   - It does NOT reject facts, block edges, or gate frontier expansion.
#   - A high source score never overrides invalid ontology or unsupported evidence.
#   - One ontology-valid + evidence-supported source is enough for an edge
#     and for suppliesTo frontier advancement (including Google News wrappers).
#   - Legacy "verification" / "independence" blocks below are documentation-only
#     and are not used for runtime decisions.
#
# Matching rule expected in code:
#   normalized_host == configured_domain
#   OR normalized_host.endswith("." + configured_domain)
# Never use naive substring matching.

version: 1

policy:
  enabled: true

  # Unknown domains remain usable so the system is not too strict.
  unknown:
    base_score: 50
    tier: unknown
    allow_for_discovery: true
    allow_for_candidate: true
    allow_for_verification: true
    can_advance_frontier_alone: false

  # Scores below this threshold are retained only for audit/discovery.
  minimum_countable_score: 35

  # Scores at or above this level may qualify as a strong single-source candidate
  # if all other requirements are also satisfied.
  strong_source_score: 85

  # "Trusted" here means a useful project prior, not a guarantee of factual correctness.
  trusted_source_score: 75

  # These sources may be kept in audit logs but cannot promote an edge.
  hard_reject_below: 20

  # A source score can never rescue a semantically invalid fact.
  require_ontology_valid: true
  require_evidence_entailment: true

  # Do not automatically reject old sources. Supplier relationships can be historical.
  # Publication time should be stored separately and interpreted at query time.
  use_recency_in_score: false

content_quality:
  # Additive modifiers applied after domain/category score.
  full_text_bonus: 5
  title_snippet_penalty: 15
  canonical_url_resolved_bonus: 2

  # Prevent title/snippet-only evidence from being treated like a full article.
  title_snippet_score_cap: 60

  # A single title/snippet can remain a candidate, but cannot become strong_candidate.
  title_snippet_can_be_strong_candidate: false

  # Supported status requires at least one full-text source.
  supported_requires_full_text: true

  # Verified status requires at least two full-text independent source groups.
  verified_min_full_text_groups: 2

verification:
  statuses:
    candidate:
      description: "One usable supporting source, or evidence below promotion thresholds."
      min_independent_source_groups: 1

    strong_candidate:
      description: "One high-quality explicit full-text source with valid ontology and entailed evidence."
      min_independent_source_groups: 1
      min_max_source_score: 85
      require_full_text: true
      require_ontology_valid: true
      require_evidence_entailment: true

    supported:
      description: "At least two genuinely independent supporting source groups."
      min_independent_source_groups: 2
      min_each_source_score: 35
      min_average_source_score: 45
      require_at_least_one_full_text: true
      require_ontology_valid: true
      require_evidence_entailment: true

    verified:
      description: "At least three independent credible source groups."
      min_independent_source_groups: 3
      min_each_source_score: 45
      min_average_source_score: 55
      require_at_least_one_trusted_source: true
      require_min_full_text_groups: 2
      require_ontology_valid: true
      require_evidence_entailment: true

  # Unknown-source behavior requested for SChain:
  # two independent unknown domains may still become supported.
  unknown_source_rule:
    allow_two_unknown_independent_sources_as_supported: true
    minimum_score_per_unknown_source: 35
    require_at_least_one_full_text: true
    require_both_evidence_entailment: true

  # Conflicting sources should not be silently averaged.
  conflict_policy:
    mark_as_contested: true
    contested_can_advance_frontier: false

frontier:
  allow_statuses:
    - supported
    - verified
    - strong_candidate

  # Weak single-source candidates stay visible in the graph,
  # but do not drive deeper expansion.
  candidate_can_advance: false

  # One primary/official source may advance if it is explicit and full-text.
  strong_candidate_can_advance: true

independence:
  # Same publisher/domain normally counts once per edge.
  one_group_per_registered_domain: true

  # Syndicated copies should collapse even when hosted on different domains.
  cluster_syndicated_content: true

  content_hash_exact_match_is_same_group: true

  # Suggested threshold for normalized title/body similarity.
  near_duplicate_similarity_threshold: 0.92

  # Press-release distributors and mirrors must resolve to the original release
  # when possible and must not inflate independent support count.
  collapse_press_release_syndication: true

  # Retrieval wrappers are never counted as publishers themselves.
  wrapper_domains_do_not_count_as_independent_sources: true

source_classes:
  official_primary:
    default_score: 95
    count_for_verification: true
    notes: "Official company/institution source. Strong for explicit claims made by that organization."

  regulatory_government:
    default_score: 96
    count_for_verification: true
    notes: "Government, regulator, exchange, or statutory filing source."

  international_organization:
    default_score: 92
    count_for_verification: true

  major_wire_news:
    default_score: 90
    count_for_verification: true

  major_financial_news:
    default_score: 88
    count_for_verification: true

  established_general_news:
    default_score: 82
    count_for_verification: true

  established_industry_trade:
    default_score: 80
    count_for_verification: true

  academic_publisher_repository:
    default_score: 78
    count_for_verification: true
    notes: "Useful for historical/background claims; not automatically authoritative for current supplier status."

  press_release_distributor:
    default_score: 72
    count_for_verification: true
    notes: "Useful primary-company evidence, but syndicated copies must collapse to one source group."

  market_aggregator:
    default_score: 58
    count_for_verification: true
    notes: "May republish third-party content; resolve original publisher when possible."

  user_generated:
    default_score: 30
    count_for_verification: false

  unknown:
    default_score: 50
    count_for_verification: true

  retrieval_wrapper:
    default_score: 0
    count_for_verification: false
    notes: "Not an original publisher; resolve canonical source URL."

