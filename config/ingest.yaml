# INGEST mode: process documents you already have. No search, no graph expansion.
#
#   python -m schain ingest --input path/to/docs

include:
  - config/base.yaml

mode: ingest

ingest:
  # Default input when --input is not given: a file or a directory.
  input: data/corpus
  # Extensions picked up when the input is a directory (searched recursively).
  file_patterns: ["*.txt", "*.md", "*.pdf"]
  chunk_size: 2000
  chunk_overlap: 200
