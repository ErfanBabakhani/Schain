# INGEST: process documents already in hand. No search, no graph expansion.
#
#   .venv/bin/python -m schain ingest --config config/ingest.yaml --input data/corpus

include:
  - config/base.yaml

mode: ingest

ingest:
  # Default input location when --input is not given. A file or a directory.
  input: data/corpus
  # Extensions picked up when the input is a directory.
  file_patterns: ["*.txt", "*.md", "*.pdf"]
  chunk_size: 2000
  chunk_overlap: 200
  on_error: IGNORE             # IGNORE = log and skip a failed chunk | RAISE = stop
