# Distributed deep discovery: resume the existing bmw-supply-chain-v2 experiment with
# the deep_discovery profile (used by notebooks/SChain_Expand.ipynb).
#
#   python -m schain expand --config config/distributed_neon_deep_discovery.yaml
#
# Needs NEON_DATABASE_URL in .env. See docs/COLAB_AND_DISTRIBUTED.md.

include:
  - config/deep_discovery.yaml

state:
  backend: postgres
  experiment_id: bmw-supply-chain-v2

distributed:
  enabled: true
  # Join the existing experiment only; never create a new one from this config.
  resume_existing_only: true
  tasks_per_session: 40
  task_lease_seconds: 900

# The experiment was created without Neo4j persistence; pinned off to keep it that way.
save:
  enabled: false
