# Colab INGEST against a local OpenAI-compatible vLLM endpoint.
#
# Inherits config/ingest.yaml (and through it config/base.yaml): ontology, storage,
# runtime, chunking, concurrency, json_mode, structured_output, etc.
# Override only the model identity for the T4-sized Colab checkpoint.
#
# Endpoint and API key come from the environment (preferred over hardcoding here):
#   export LLM_API_BASE_URL=http://127.0.0.1:8000/v1
#   export LLM_API_KEY=EMPTY
#
#   python -m schain ingest \
#       --config config/colab_ingest.yaml \
#       --input data/corpus \
#       --no-neo4j \
#       --restart

include:
  - config/ingest.yaml

llm:
  provider: local
  model: Qwen/Qwen3-4B-Instruct-2507
  # Clear the base.yaml default so LLM_API_BASE_URL from the environment is used.
  base_url: null
