# Example configuration shape. Values are starting defaults, not immutable decisions.

runtime:
  resume: true
  restart_from_scratch: false

mode: ingest  # ingest | expand

llm:
  provider: local
  model: Qwen/Qwen3.8-27B
  backend: vllm
  enable_thinking: false
  max_model_len: 16384

ontology:
  dynamic: false
  entity_types:
    - Company
    - Location
    - Material
    - Person
    - Product
    - Mine
  relation_types:
    - suppliesTo
    - locatedIn
    - owns
    - produces

seeds:
  ev_manufacturers:
    - Toyota
    - Tesla Inc.
    - BMW
    - BYD Co., Ltd.
  battery_suppliers:
    - Samsung SDI
    - CATL
    - Panasonic
  mining_companies:
    - Zijin Mining
    - Albemarle Corporation
    - Tianqi Lithium
    - Ganfeng Lithium Co Ltd
    - Norilsk Nickel
    - Jinchuan Group

expansion:
  max_tier: 3
  expandable_types:
    - Company

  sources:
    wikipedia:
      enabled: true
    google_news:
      enabled: true
    gdelt:
      enabled: true

  search:
    defaults:
      max_results: 20

    tiers:
      0:
        defaults:
          max_results: 30
        queries:
          - query: '"{entity}" suppliers'
          - query: '"{entity}" sourcing'
          - query: '"{entity}" battery suppliers'
          - query: '"{entity}" semiconductor suppliers'

      1:
        defaults:
          max_results: 20
        queries:
          - query: '"{entity}" suppliers'
          - query: '"{entity}" component suppliers'
          - query: '"{entity}" raw material suppliers'

      2:
        queries:
          - query: '"{entity}" material suppliers'
          - query: '"{entity}" raw material sources'
          - query: '"{entity}" mines'
            max_results: 40

storage:
  raw_documents: data/raw/documents.jsonl
  normalized_documents: data/processed/documents.parquet
  extracted_facts: data/processed/facts.parquet
  search_results: data/processed/search_results.parquet
  state_db: data/state/state.db

neo4j:
  # Credentials belong in environment variables, never in this file.
  database: neo4j
